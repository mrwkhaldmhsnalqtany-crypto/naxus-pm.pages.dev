<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naxus Global Energy AI Network</title>

<style>
:root{
    --bg:#050814;
    --panel:#0e1626;
    --text:#eaf2ff;
    --muted:#9fb0c8;
    --accent:#00ffd0;
    --warn:#ffcc66;
    --danger:#ff5c7a;
    --line:rgba(255,255,255,0.06);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* HEADER */
.header{
    position:fixed;
    top:0;
    width:100%;
    height:60px;
    background:rgba(5,8,20,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:1000;
}

.brand{
    color:var(--accent);
    font-weight:bold;
}

.status{
    color:var(--muted);
    font-size:13px;
}

/* LAYOUT */
.container{
    margin-top:60px;
    padding:25px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:15px;
}

/* CARD */
.card{
    background:var(--panel);
    padding:20px;
    border-radius:10px;
    border:1px solid var(--line);
    transition:0.3s;
}

.card:hover{
    border-color:var(--accent);
    transform:translateY(-5px);
}

.kpi{
    font-size:28px;
    color:var(--accent);
    font-weight:bold;
}

/* WORLD GRID MAP */
.map{
    margin:20px 0;
    padding:25px;
    border-radius:12px;
    background:linear-gradient(135deg,#0b1d2a,#0a0f1a);
    border:1px solid var(--line);
}

/* REGION */
.region{
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    background:#0e1626;
    display:flex;
    justify-content:space-between;
    border:1px solid var(--line);
}

.ok{color:var(--accent);}
.mid{color:var(--warn);}
.low{color:var(--danger);}

/* AI PANEL */
.ai{
    background:var(--panel);
    padding:20px;
    border-radius:12px;
    border:1px solid var(--line);
    margin-bottom:15px;
}

button{
    margin-top:10px;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    color:var(--muted);
    border-top:1px solid var(--line);
    margin-top:30px;
}

@media(max-width:900px){
    .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="header">
    <div class="brand">Naxus Global Energy Network</div>
    <div class="status" id="status">🟢 الشبكة مستقرة</div>
</div>

<div class="container">

<!-- AI CORE -->
<div class="ai">
    <h3 style="color:var(--accent)">🧠 Global Energy AI Core</h3>
    <p id="aiText" style="color:var(--muted)">تحليل الشبكة العالمية...</p>
    <button onclick="runAI()">تشغيل تحليل الشبكة</button>
</div>

<!-- KPIs -->
<div class="grid">
    <div class="card"><div class="kpi" id="total">100%</div>استقرار الشبكة</div>
    <div class="card"><div class="kpi" id="flow">8.7M</div>تدفق الطاقة</div>
    <div class="card"><div class="kpi" id="balance">STABLE</div>التوازن</div>
    <div class="card"><div class="kpi" id="risk">LOW</div>المخاطر</div>
</div>

<!-- GLOBAL NETWORK -->
<div class="map">
    <h3>🌍 شبكة الطاقة العالمية</h3>

    <div class="region">
        الشرق الأوسط <span id="me" class="ok">Stable</span>
    </div>

    <div class="region">
        إفريقيا <span id="af" class="ok">Stable</span>
    </div>

    <div class="region">
        آسيا <span id="as" class="ok">Stable</span>
    </div>

    <div class="region">
        أوروبا <span id="eu" class="ok">Stable</span>
    </div>
</div>

<footer>
© 2026 Naxus Global Energy AI Network
</footer>

</div>

<script>

function randState(){
    let r = Math.random();
    if(r > 0.75) return "HIGH";
    if(r > 0.4) return "STABLE";
    return "LOW";
}

function runAI(){

    let flow = (8 + Math.random()*2).toFixed(2);
    let balance = "STABLE";
    let risk = "LOW";

    let regions = ["me","af","as","eu"];

    regions.forEach(r=>{
        let state = randState();
        document.getElementById(r).innerText = state;

        if(state === "HIGH"){
            document.getElementById(r).className = "mid";
        }else if(state === "LOW"){
            document.getElementById(r).className = "low";
        }else{
            document.getElementById(r).className = "ok";
        }
    });

    if(Math.random() > 0.8){
        balance = "ADJUSTING";
        risk = "MEDIUM";
    }

    document.getElementById("flow").innerText = flow + "M";
    document.getElementById("balance").innerText = balance;
    document.getElementById("risk").innerText = risk;

    document.getElementById("total").innerText =
        (95 + Math.random()*4).toFixed(1) + "%";

    document.getElementById("aiText").innerText =
        "AI: تحليل تدفق الطاقة العالمي — إعادة موازنة الشبكة عند الحاجة";

    document.getElementById("status").innerText =
        "🟢 الشبكة تعمل ضمن الحدود الطبيعية";

}

// auto AI loop
setInterval(runAI, 4000);

runAI();

</script>

</body>
</html>
