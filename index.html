<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy State OS - Live</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050814;
    color:#eaf2ff;
}

header{
    background:#0e1626;
    padding:15px;
    color:#00ffd0;
    font-weight:bold;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.card{
    background:#0e1626;
    padding:18px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
}

.kpi{
    font-size:26px;
    color:#00ffd0;
    font-weight:bold;
}

.status{
    margin:15px 0;
    padding:12px;
    border-radius:8px;
    background:rgba(0,255,208,0.08);
    border:1px solid rgba(0,255,208,0.3);
    color:#9fb0c8;
}

.alert{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
}

.good{border:1px solid #00ffd0;color:#00ffd0;}
.warn{border:1px solid #ffcc66;color:#ffcc66;}
.bad{border:1px solid #ff5c7a;color:#ff5c7a;}

button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:8px;
    background:#00ffd0;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>🏛 Energy State OS - LIVE SIMULATION</header>

<div class="container">

<div class="status" id="status">
النظام يعمل… مراقبة الطاقة جارية بشكل لحظي
</div>

<div class="grid">

<div class="card">
<div class="kpi" id="prod">0</div>
الإنتاج
</div>

<div class="card">
<div class="kpi" id="dem">0</div>
الطلب
</div>

<div class="card">
<div class="kpi" id="res">0</div>
الاحتياطي
</div>

<div class="card">
<div class="kpi" id="risk">---</div>
المخاطر
</div>

</div>

<button onclick="updateSystem()">تشغيل تحديث ذكي</button>

<div class="alert good" id="decision">
AI جاهز للتحليل
</div>

</div>

<script>

function updateSystem(){

    let production = Math.floor(8500 + Math.random()*1500);
    let demand = Math.floor(8000 + Math.random()*1200);

    let reserve = production - demand;

    let risk = "LOW";
    let decision = "";

    if(reserve < 0){
        risk = "HIGH";
        decision = "⚠ عجز طاقة — يجب رفع الإنتاج فورًا";
    }
    else if(reserve < 500){
        risk = "MEDIUM";
        decision = "🟡 توازن حساس — زيادة الإنتاج بنسبة 5%";
    }
    else{
        risk = "LOW";
        decision = "🟢 النظام مستقر — تخزين الفائض";
    }

    document.getElementById("prod").innerText = production;
    document.getElementById("dem").innerText = demand;
    document.getElementById("res").innerText = reserve;
    document.getElementById("risk").innerText = risk;
    document.getElementById("decision").innerText = decision;

    document.getElementById("status").innerText =
        "🧠 AI يعمل: تحليل الطاقة العالمية في الوقت الحقيقي";

}

// تشغيل تلقائي
setInterval(updateSystem, 3000);
updateSystem();

</script>

</body>
</html>
