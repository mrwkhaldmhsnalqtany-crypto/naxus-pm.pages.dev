<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy State OS</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050814;
    color:#eaf2ff;
}

header{
    padding:15px 20px;
    background:#0e1626;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    color:#00ffd0;
    font-size:18px;
}

.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#0e1626;
    padding:18px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
}

.kpi{
    font-size:26px;
    color:#00ffd0;
    font-weight:bold;
}

.status{
    padding:10px;
    margin-bottom:15px;
    border-radius:8px;
    background:rgba(0,255,208,0.08);
    border:1px solid rgba(0,255,208,0.3);
    color:#9fb0c8;
}

.alert{
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

.good{border:1px solid #00ffd0;color:#00ffd0;}
.warn{border:1px solid #ffcc66;color:#ffcc66;}
.bad{border:1px solid #ff5c7a;color:#ff5c7a;}

button{
    margin-top:10px;
    padding:10px 14px;
    border:none;
    border-radius:8px;
    background:#00ffd0;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🏛 Energy State OS</h1>
<div id="mode">LIVE SYSTEM</div>
</header>

<div class="container">

<div class="status" id="status">
النظام يعمل في الوضع السيادي — مراقبة الطاقة جارية...
</div>

<div class="grid">

<div class="card">
<div class="kpi" id="production">9000</div>
الإنتاج (MW)
</div>

<div class="card">
<div class="kpi" id="demand">8500</div>
الطلب (MW)
</div>

<div class="card">
<div class="kpi" id="reserve">500</div>
الاحتياطي
</div>

<div class="card">
<div class="kpi" id="efficiency">99%</div>
الكفاءة
</div>

</div>

<div class="card" style="margin-top:15px;">
<h3>🧠 AI القرار السيادي</h3>
<div id="decision">جارٍ تحليل النظام...</div>
<button onclick="runDecision()">تشغيل تحليل فوري</button>
<div id="alert" class="alert good">النظام مستقر</div>
</div>

</div>

<script>

function runDecision(){

    let production = Math.floor(8500 + Math.random()*1500);
    let demand = Math.floor(8000 + Math.random()*1200);

    let reserve = production - demand;
    let efficiency = (97 + Math.random()*2).toFixed(1);

    let decision = "";
    let alertBox = document.getElementById("alert");

    if(reserve < 0){
        decision = "⚠ عجز في الطاقة — تفعيل استيراد فوري أو تخفيض الطلب";
        alertBox.className = "alert bad";
        alertBox.innerText = "خطر: الطلب أعلى من الإنتاج";
    }
    else if(reserve < 500){
        decision = "🟡 توازن حساس — رفع الإنتاج بنسبة 5%";
        alertBox.className = "alert warn";
        alertBox.innerText = "تحذير: احتياطي منخفض";
    }
    else{
        decision = "🟢 النظام مستقر — تخزين الفائض في الشبكة الوطنية";
        alertBox.className = "alert good";
        alertBox.innerText = "استقرار سيادي كامل";
    }

    document.getElementById("production").innerText = production;
    document.getElementById("demand").innerText = demand;
    document.getElementById("reserve").innerText = reserve;
    document.getElementById("efficiency").innerText = efficiency + "%";
    document.getElementById("decision").innerText = decision;

}

setInterval(runDecision,4000);
runDecision();

</script>

</body>
</html>
