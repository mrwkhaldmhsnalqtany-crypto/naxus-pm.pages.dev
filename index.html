<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naxus Energy Multiverse</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#040713;
    font-family:Arial;
    color:#eaf2ff;
}

#ui{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    background:rgba(0,0,0,0.4);
    padding:12px 15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    color:#00ffd0;
}

canvas{
    display:block;
}
</style>
</head>

<body>

<div id="ui">
🧠 Energy Multiverse Core
<div id="status" style="color:#9fb0c8;font-size:13px;margin-top:5px;">
Initializing universes...
</div>
</div>

<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let universes = [];

// إنشاء عدة أكوان
for(let i=0;i<5;i++){
    universes.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: 80 + Math.random()*120,
        energy: Math.random(),
        dx: (Math.random()-0.5)*1.5,
        dy: (Math.random()-0.5)*1.5,
        state: "STABLE"
    });
}

function update(){

    ctx.fillStyle="#040713";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    universes.forEach(u=>{

        // حركة الكون
        u.x += u.dx;
        u.y += u.dy;

        if(u.x < 0 || u.x > canvas.width) u.dx *= -1;
        if(u.y < 0 || u.y > canvas.height) u.dy *= -1;

        // طاقة متغيرة
        u.energy += (Math.random()-0.5)*0.03;
        u.energy = Math.max(0,Math.min(1,u.energy));

        // تحديد الحالة
        if(u.energy > 0.7) u.state = "HIGH ENERGY";
        else if(u.energy < 0.3) u.state = "LOW ENERGY";
        else u.state = "STABLE";

        // رسم الكون
        let glow = 20 + u.energy*40;

        let gradient = ctx.createRadialGradient(u.x,u.y,10,u.x,u.y,u.r);
        gradient.addColorStop(0,"rgba(0,255,208,0.4)");
        gradient.addColorStop(1,"rgba(0,255,208,0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(u.x,u.y,u.r,0,Math.PI*2);
        ctx.fill();

        // النواة
        ctx.beginPath();
        ctx.fillStyle = "#00ffd0";
        ctx.arc(u.x,u.y,6 + u.energy*4,0,Math.PI*2);
        ctx.fill();

        // خطوط الربط بين الأكوان
        universes.forEach(v=>{
            let dist = Math.hypot(u.x-v.x,u.y-v.y);
            if(dist < 250){
                ctx.beginPath();
                ctx.strokeStyle="rgba(0,255,208,0.08)";
                ctx.moveTo(u.x,u.y);
                ctx.lineTo(v.x,v.y);
                ctx.stroke();
            }
        });

    });

    requestAnimationFrame(update);
}

update();

// AI status engine
function aiCore(){

    let high = universes.filter(u=>u.energy>0.7).length;
    let low = universes.filter(u=>u.energy<0.3).length;

    let status = "";

    if(high > low){
        status = "🟡 النظام في حالة توسع طاقي بين الأكوان";
    }else if(low > high){
        status = "🔴 نقص طاقة في عدة أكوان — إعادة توازن";
    }else{
        status = "🟢 توازن كوني مستقر عبر جميع الأكوان";
    }

    document.getElementById("status").innerText = status;
}

setInterval(aiCore, 2500);

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
