<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naxus PM</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* الشريط الجانبي */
.sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 220px;
    height: 100%;
    background: #111827;
    padding-top: 20px;
}

.sidebar h2 {
    text-align: center;
    color: #38bdf8;
}

.sidebar a {
    display: block;
    padding: 15px;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #1e293b;
    padding-right: 25px;
}

/* المحتوى */
.content {
    margin-right: 230px;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    margin: 10px 0;
    border-radius: 10px;
}
</style>

<body>

<div class="sidebar">
    <h2>Naxus PM</h2>
    <a href="#">🏠 الرئيسية</a>

    <a href="#">⚡ الطاقة</a>
    <a href="#">📈 التقارير</a>
</div>

<div class="content">
    <h1>مرحباً بك في Naxus PM</h1>

    <div class="card">
        لوحة التحكم الرئيسية للموقع 🚀
    </div>

    <div class="card">
        هنا سيتم عرض المشاريع والاستثمارات
    </div>
</div>

</body>
</html>
