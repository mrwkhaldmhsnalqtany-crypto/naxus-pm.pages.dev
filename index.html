<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naxus Autonomous Energy AI</title>

<style>
:root{
    --bg:#040712;
    --panel:#0e1626;
    --text:#eaf2ff;
    --muted:#9fb0c8;
    --accent:#00ffd0;
    --warn:#ffcc66;
    --danger:#ff5c7a;
    --line:rgba(255,255,255,0.06);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* TOP BAR */
.topbar{
    position:fixed;
    top:0;
    width:100%;
    height:60px;
    background:rgba(4,7,18,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:1000;
}

.brand{
    color:var(--accent);
    font-weight:bold;
    letter-spacing:1px;
}

.status{
    font-size:13px;
    color:var(--muted);
}

/* LAYOUT */
.container{
    display:grid;
    grid-template-columns:260px 1fr;
    margin-top:60px;
}

/* SIDEBAR */
.sidebar{
    background:var(--panel);
    min-height:100vh;
    padding:20px;
    border-right:1px solid var(--line);
}

.sidebar h3{
    color:var(--accent);
    margin-bottom:15px;
}

.sidebar a{
    display:block;
    color:var(--muted);
    text-decoration:none;
    padding:10px;
    border-radius:6px;
}

.sidebar a:hover{
    background:#0b1220;
    color:var(--accent);
}

/* MAIN */
.main{
    padding:25px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

/* CARD */
.card{
    background:var(--panel);
    padding:20px;
    border-radius:10px;
    border:1px solid var(--line);
    transition:0.3s;
}

.card:hover{
    border-color:var(--accent);
    transform:translateY(-5px);
}

.kpi{
    font-size:30px;
    color:var(--accent);
    font-weight:bold;
}

/* AI CORE */
.ai{
    background:linear-gradient(135deg,#0b1d2a,#0e1626);
    padding:22px;
    border-radius:12px;
    border:1px solid var(--line);
    margin-bottom:20px;
}

.ai-title{
    color:var(--accent);
    font-weight:bold;
}

.ai-log{
    color:var(--muted);
    margin-top:8px;
    min-height:40px;
}

/* ALERT */
.alert{
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
    border:1px solid var(--warn);
    background:rgba(255,204,102,0.08);
    color:var(--warn);
}

/* BUTTON */
button{
    margin-top:10px;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    background:var(--accent);
    color:#000;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    color:var(--muted);
    border-top:1px solid var(--line);
    margin-top:30px;
}

@media(max-width:900px){
    .container{grid-template-columns:1fr;}
    .sidebar{display:none;}
}
</style>
</head>

<body>

<div class="topbar">
    <div class="brand">Naxus Autonomous AI</div>
    <div class="status" id="status">🟢 النظام يراقب الطاقة</div>
</div>

<div class="container">

<div class="sidebar">
    <h3>AI Core</h3>
    <a>🤖 العقل الذكي</a>
    <a>⚡ الطاقة</a>
    <a>🌍 الشبكة العالمية</a>
    <a>🛢 النفط</a>
    <a>📊 القرارات</a>
</div>

<div class="main">

<div class="alert" id="alertBox">
⚠ النظام في وضع المراقبة الذكية
</div>

<div class="ai">
    <div class="ai-title">🧠 العقل الذاتي للطاقة</div>
    <div class="ai-log" id="aiLog">تشغيل النظام الذاتي...</div>
    <button onclick="forceDecision()">تشغيل قرار ذكي يدوي</button>
</div>

<h2>لوحة التحكم الذاتية</h2>

<div class="grid">

<div class="card">
<div class="kpi" id="energy">9000</div>
الإنتاج
</div>

<div class="card">
<div class="kpi" id="demand">8500</div>
الطلب
</div>

<div class="card">
<div class="kpi" id="eff">99%</div>
الكفاءة
</div>

<div class="card">
<div class="kpi" id="state">STABLE</div>
الحالة
</div>

</div>

<footer>
© 2026 Naxus Autonomous Energy AI
</footer>

</div>

</div>

<script>

function aiDecision(){

    let energy = Math.floor(8500 + Math.random()*1200);
    let demand = Math.floor(8000 + Math.random()*1200);

    let state = "STABLE";
    let log = "";
    let alert = "النظام يعمل بشكل طبيعي";

    if(energy < demand){
        state = "BALANCING";
        log = "AI: زيادة الإنتاج + إعادة توزيع الطاقة تلقائيًا";
        alert = "⚠ تنبيه: الطلب أعلى من الإنتاج — تفعيل موازنة تلقائية";
    }

    if(energy > demand + 800){
        state = "SURPLUS";
        log = "AI: تخفيض الإنتاج + تخزين الفائض";
        alert = "🟢 فائض طاقة — النظام يعيد التوازن";
    }

    if(Math.random() > 0.85){
        state = "OPTIMIZED";
        log = "AI: تحسين شامل للشبكة العالمية للطاقة";
    }

    let eff = (97 + Math.random()*2).toFixed(1);

    document.getElementById("energy").innerText = energy;
    document.getElementById("demand").innerText = demand;
    document.getElementById("eff").innerText = eff + "%";
    document.getElementById("state").innerText = state;

    document.getElementById("aiLog").innerText = log;
    document.getElementById("alertBox").innerText = alert;

}

// manual decision
function forceDecision(){
    aiDecision();
}

// auto loop (autonomous behavior)
setInterval(aiDecision, 4000);

aiDecision();

</script>

</body>
</html>
