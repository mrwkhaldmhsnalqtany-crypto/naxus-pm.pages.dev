<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy State OS</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050814;
    color:#eaf2ff;
}

/* TOP BAR */
.topbar{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:60px;
    background:#0e1626;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    z-index:1000;
}

.brand{
    color:#00ffd0;
    font-weight:bold;
}

.menu-btn{
    background:none;
    border:1px solid #00ffd0;
    color:#00ffd0;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:60px;
    right:-260px;
    width:240px;
    height:100%;
    background:#0e1626;
    border-left:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
    padding:15px;
}

.sidebar.open{
    right:0;
}

.sidebar a{
    display:block;
    padding:10px;
    color:#9fb0c8;
    text-decoration:none;
    border-radius:6px;
}

.sidebar a:hover{
    background:#111a2e;
    color:#00ffd0;
}

/* MAIN */
.main{
    margin-top:60px;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.card{
    background:#0e1626;
    padding:18px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
}

.kpi{
    font-size:26px;
    color:#00ffd0;
    font-weight:bold;
}

.status{
    margin:15px 0;
    padding:12px;
    border-radius:8px;
    background:rgba(0,255,208,0.08);
    border:1px solid rgba(0,255,208,0.3);
    color:#9fb0c8;
}

button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:8px;
    background:#00ffd0;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="brand">🏛 Energy State OS</div>
    <button class="menu-btn" onclick="toggleMenu()">☰ الأقسام</button>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <a href="#">🏠 الرئيسية</a>
    <a href="#">⚡ الإنتاج</a>
    <a href="#">📊 الطلب</a>
    <a href="#">🧠 الذكاء الاصطناعي</a>
    <a href="#">🌍 الشبكة العالمية</a>
    <a href="#">🚨 المخاطر</a>
</div>

<!-- MAIN -->
<div class="main">

<div class="status" id="status">
النظام يعمل… مراقبة الطاقة جارية
</div>

<div class="grid">

<div class="card">
<div class="kpi" id="prod">0</div>
الإنتاج
</div>

<div class="card">
<div class="kpi" id="dem">0</div>
الطلب
</div>

<div class="card">
<div class="kpi" id="res">0</div>
الاحتياطي
</div>

<div class="card">
<div class="kpi" id="risk">---</div>
المخاطر
</div>

</div>

<button onclick="updateSystem()">تشغيل تحليل AI</button>

<div class="card" id="decision" style="margin-top:15px;">
AI جاهز للتحليل
</div>

</div>

<script>

function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("open");
}

function updateSystem(){

    let production = Math.floor(8500 + Math.random()*1500);
    let demand = Math.floor(8000 + Math.random()*1200);

    let reserve = production - demand;

    let risk = "LOW";
    let decision = "";

    if(reserve < 0){
        risk = "HIGH";
        decision = "⚠ عجز طاقة — رفع الإنتاج فورًا";
    }
    else if(reserve < 500){
        risk = "MEDIUM";
        decision = "🟡 توازن حساس — زيادة الإنتاج";
    }
    else{
        risk = "LOW";
        decision = "🟢 النظام مستقر — تخزين الفائض";
    }

    document.getElementById("prod").innerText = production;
    document.getElementById("dem").innerText = demand;
    document.getElementById("res").innerText = reserve;
    document.getElementById("risk").innerText = risk;
    document.getElementById("decision").innerText = decision;

    document.getElementById("status").innerText =
        "🧠 AI: تحليل مباشر لشبكة الطاقة العالمية";

}

setInterval(updateSystem,4000);
updateSystem();

</script>

</body>
</html>
