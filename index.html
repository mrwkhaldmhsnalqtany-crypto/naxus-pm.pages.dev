<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naxus Energy Galaxy AI</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#030510;
    font-family:Arial;
}

#ui{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    background:rgba(0,0,0,0.4);
    padding:12px 15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    color:#00ffd0;
}

#status{
    color:#9fb0c8;
    font-size:13px;
    margin-top:5px;
}

canvas{
    display:block;
}
</style>
</head>

<body>

<div id="ui">
🧠 Energy Galaxy AI
<div id="status">Initializing galactic energy field...</div>
</div>

<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    2000
);
camera.position.z = 300;

// Renderer
const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    antialias:true
});
renderer.setSize(window.innerWidth, window.innerHeight);

// Galaxy group
const galaxy = new THREE.Group();
scene.add(galaxy);

// Energy stars (universes)
let stars = [];

function createStar(){

    let geometry = new THREE.SphereGeometry(2.5, 12, 12);
    let material = new THREE.MeshBasicMaterial({color:0x00ffd0});

    let star = new THREE.Mesh(geometry, material);

    star.position.x = (Math.random()-0.5)*600;
    star.position.y = (Math.random()-0.5)*600;
    star.position.z = (Math.random()-0.5)*600;

    star.userData = {
        vx:(Math.random()-0.5)*0.4,
        vy:(Math.random()-0.5)*0.4,
        vz:(Math.random()-0.5)*0.4,
        energy:Math.random()
    };

    galaxy.add(star);
    stars.push(star);
}

// create galaxy stars
for(let i=0;i<200;i++){
    createStar();
}

// light core
const light = new THREE.PointLight(0x00ffd0,2);
light.position.set(0,0,0);
scene.add(light);

// animation loop
function animate(){

    requestAnimationFrame(animate);

    stars.forEach(s=>{

        s.position.x += s.userData.vx;
        s.position.y += s.userData.vy;
        s.position.z += s.userData.vz;

        // bounds
        if(Math.abs(s.position.x)>600) s.userData.vx *= -1;
        if(Math.abs(s.position.y)>600) s.userData.vy *= -1;
        if(Math.abs(s.position.z)>600) s.userData.vz *= -1;

        // energy drift
        s.userData.energy += (Math.random()-0.5)*0.02;
        s.userData.energy = Math.max(0,Math.min(1,s.userData.energy));

        // size based on energy
        let scale = 1 + s.userData.energy*2;
        s.scale.set(scale,scale,scale);

        // glow color shift
        let g = 0.6 + s.userData.energy*0.4;
        s.material.color.setRGB(0,1,g);

    });

    // galaxy rotation (cosmic motion)
    galaxy.rotation.y += 0.0015;
    galaxy.rotation.x += 0.0008;

    renderer.render(scene,camera);
}

animate();

// AI Core
function updateAI(){

    let avg = stars.reduce((a,b)=>a+b.userData.energy,0)/stars.length;

    let status = "";

    if(avg > 0.7){
        status = "🟡 تمدد مجري — نشاط طاقي عالي";
    }else if(avg < 0.3){
        status = "🔴 انكماش طاقي — إعادة توازن المجرة";
    }else{
        status = "🟢 مجرة الطاقة مستقرة — النظام في توازن كوني";
    }

    document.getElementById("status").innerText = status;
}

setInterval(updateAI,2000);

// resize
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
